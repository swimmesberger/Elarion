[package]
name = "elarion-typst"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native Typst engine for Elarion.Typst.Native: compiles Typst documents to PDF in-process behind a small C ABI."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
typst = "=0.15.1"
typst-pdf = "=0.15.1"
typst-layout = "=0.15.1"
typst-kit = { version = "=0.15.1", default-features = false, features = ["embedded-fonts", "scan-fonts", "system-files", "system-packages", "datetime"] }
comemo = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
